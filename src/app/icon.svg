<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16123a"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#halo)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#8b8fff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- tilted orbit ring -->
  <ellipse cx="32" cy="33" rx="25" ry="9" fill="none" stroke="url(#ring)" stroke-width="1.8" transform="rotate(-18 32 33)"/>

  <!-- neon S monogram -->
  <path d="M42 19.5C38.5 14.8 22.5 14.6 22.5 24.2C22.5 33.4 41.5 30.6 41.5 40.4C41.5 49.6 25.2 49.4 21.5 44"
        fill="none" stroke="url(#s)" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- cyan dot from the "shakhawat." wordmark -->
  <circle cx="48.5" cy="46.5" r="3.4" fill="#67e8f9" filter="url(#glow)"/>
</svg>
